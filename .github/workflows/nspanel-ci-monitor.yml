name: NSPanel CI event monitor

run-name: "CI monitor — ${{ github.event.workflow_run.run_number || 'manual' }} — ${{ github.event.action || 'manual' }}"

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["NSPanel kernel CI/CD"]
    types: [requested, in_progress, completed]
    branches: [fix/rockchip-gem-zero-size]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional GitHub Actions run ID to inspect"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nspanel-ci-monitor-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}-${{ github.event.action || 'manual' }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect exact CI run and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect run, jobs, current branch HEAD and logs
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -Eeuo pipefail
          API="https://api.github.com"
          if [ -n "${INPUT_RUN_ID:-}" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$(jq -r '.workflow_run.id // empty' "$EVENT_PATH")"
            if [ -z "$RUN_ID" ]; then
              RUN_ID="$(api_get "$API/repos/$TARGET_REPOSITORY/actions/runs?branch=fix%2Frockchip-gem-zero-size&per_page=1" | jq -r '.workflow_runs[0].id // empty')"
            fi
          fi
          test -n "$RUN_ID" || { echo "::error::No workflow run ID in event"; exit 1; }

          api_get() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }

          RUN_JSON="$(api_get "$API/repos/$TARGET_REPOSITORY/actions/runs/$RUN_ID")"
          SHA="$(jq -r '.head_sha' <<<"$RUN_JSON")"
          BRANCH="$(jq -r '.head_branch' <<<"$RUN_JSON")"
          RUN_NUMBER="$(jq -r '.run_number' <<<"$RUN_JSON")"
          ATTEMPT="$(jq -r '.run_attempt' <<<"$RUN_JSON")"
          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // "—"' <<<"$RUN_JSON")"
          RUN_URL="$(jq -r '.html_url' <<<"$RUN_JSON")"
          WORKFLOW_NAME="$(jq -r '.name' <<<"$RUN_JSON")"
          EVENT="$(jq -r '.event' <<<"$RUN_JSON")"
          STARTED="$(jq -r '.run_started_at // .created_at' <<<"$RUN_JSON")"
          UPDATED="$(jq -r '.updated_at' <<<"$RUN_JSON")"

          HEAD="$(git ls-remote "https://github.com/$TARGET_REPOSITORY.git" "refs/heads/$BRANCH" | awk 'NR==1 {print $1}')"
          if [ -z "$HEAD" ]; then
            HEAD="unavailable"
            SHA_MATCH="UNKNOWN"
          elif [ "$HEAD" = "$SHA" ]; then
            SHA_MATCH="YES"
          else
            SHA_MATCH="NO"
          fi

          JOBS_JSON="$(api_get "$API/repos/$TARGET_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          mkdir -p monitor-output/logs
          {
            echo "# NSPanel kernel CI — automatic event report"
            echo
            echo "- **Workflow:** $WORKFLOW_NAME (#$RUN_NUMBER, attempt $ATTEMPT)"
            echo "- **Event:** $EVENT / ${{ github.event.action || 'workflow_dispatch' }}"
            echo "- **Branch:** `$BRANCH`"
            echo "- **Run SHA:** `$SHA`"
            echo "- **Current remote HEAD:** `$HEAD`"
            echo "- **Run SHA equals current HEAD:** **$SHA_MATCH**"
            echo "- **Run status:** $STATUS"
            echo "- **Conclusion:** $CONCLUSION"
            echo "- **Started:** $STARTED"
            echo "- **Last updated:** $UPDATED"
            echo "- **Observed (Europe/Paris):** $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- **Run:** $RUN_URL"
            echo
            echo "## Jobs"
            jq -r '.jobs[] | "- **\(.name)** — \(.status) / \(.conclusion // "in progress") — [job](https://github.com/'"$TARGET_REPOSITORY"'/actions/runs/'"$RUN_ID"'/job/\(.id))"' <<<"$JOBS_JSON"
          } > monitor-output/monitor-report.md

          jq -r '.jobs[] | [.id, .name, .status, (.conclusion // ""), (.steps // [] | map("\(.name): \(.status)/\(.conclusion // "pending")") | join("; "))] | @tsv' <<<"$JOBS_JSON" > monitor-output/jobs.tsv

          if [ "$STATUS" = "completed" ]; then
            echo >> monitor-output/monitor-report.md
            echo "## Failure analysis" >> monitor-output/monitor-report.md
            if [ "$CONCLUSION" = "failure" ]; then
              if curl --fail --location --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                "$API/repos/$TARGET_REPOSITORY/actions/runs/$RUN_ID/logs" \
                -o monitor-output/logs/run-logs.zip; then
                unzip -oq monitor-output/logs/run-logs.zip -d monitor-output/logs/unpacked || true
                if [ -d monitor-output/logs/unpacked ]; then
                  grep -RniE -m 30 'fatal error:|(^|[[:space:]])error:|undefined reference|No such file or directory|command not found|No space left|timed out|runner.*lost|cancelled|Error [0-9]+' monitor-output/logs/unpacked > monitor-output/logs/relevant-errors.txt || true
                fi
                if [ -s monitor-output/logs/relevant-errors.txt ]; then
                  FIRST="$(head -n 1 monitor-output/logs/relevant-errors.txt)"
                  echo "- **First matching diagnostic:** `$FIRST`" >> monitor-output/monitor-report.md
                  if grep -Eqi 'fatal error:|error:|undefined reference|Error [0-9]+' monitor-output/logs/relevant-errors.txt; then
                    echo "- **Initial classification:** source/build failure candidate; inspect the full log context before attributing root cause." >> monitor-output/monitor-report.md
                  elif grep -Eqi 'runner.*lost|timed out|No space left|command not found' monitor-output/logs/relevant-errors.txt; then
                    echo "- **Initial classification:** runner/environment/infrastructure failure candidate." >> monitor-output/monitor-report.md
                  fi
                else
                  echo "- No matching compiler/runtime diagnostic extracted; consult the attached full logs." >> monitor-output/monitor-report.md
                fi
              else
                echo "- GitHub did not make the run log archive available to this monitor invocation." >> monitor-output/monitor-report.md
              fi
            else
              echo "- No failure analysis required (conclusion: $CONCLUSION)." >> monitor-output/monitor-report.md
            fi
          else
            echo >> monitor-output/monitor-report.md
            echo "## Current execution" >> monitor-output/monitor-report.md
            echo "- This event captures the run-level state and the current job/step snapshot. A later GitHub `in_progress` or `completed` event will generate a separate report." >> monitor-output/monitor-report.md
          fi

          {
            echo "## NSPanel CI event monitor"
            cat monitor-output/monitor-report.md
          } >> "$GITHUB_STEP_SUMMARY"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "run_conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "sha_match=$SHA_MATCH" >> "$GITHUB_OUTPUT"

      - name: Preserve report and available logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nspanel-ci-monitor-${{ steps.inspect.outputs.run_id || github.run_id }}-${{ github.event.action || 'manual' }}
          path: monitor-output/
          if-no-files-found: warn
          retention-days: 30
